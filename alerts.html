<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090910"><title>CORE ALERTS — DONAT CORE</title>
<style>
:root{color-scheme:dark;--accent:#a78bfa;--glow:rgba(167,139,250,.3);--cyan:#43ead7}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:system-ui,sans-serif;color:#fff}.stage{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:22px}.alert{width:min(680px,100%);display:grid;grid-template-columns:8px 1fr;gap:0;border:1px solid color-mix(in srgb,var(--accent) 70%,transparent);border-radius:22px;overflow:hidden;background:linear-gradient(115deg,rgba(15,14,28,.97),rgba(8,13,20,.94));box-shadow:0 0 42px var(--glow),0 18px 55px #0007;opacity:0;transform:translateY(28px) scale(.96);filter:blur(4px)}.alert.show{animation:enter .55s cubic-bezier(.2,.8,.2,1) forwards,leave .45s ease var(--duration) forwards}.alert.anim-slide.show{animation:slideIn .5s ease-out forwards,leave .4s ease var(--duration) forwards}.alert.anim-pop.show{animation:popIn .42s cubic-bezier(.2,1.5,.5,1) forwards,leave .4s ease var(--duration) forwards}.alert.anim-glitch.show{animation:glitchIn .55s steps(1,end) forwards,leave .4s ease var(--duration) forwards}.alert.with-image{grid-template-columns:8px 104px 1fr}.art{display:none;width:104px;min-height:100%;object-fit:cover;background:#111}.with-image .art{display:block}.with-image .content{padding-left:18px}@media(max-width:480px){.alert.with-image{grid-template-columns:6px 70px 1fr}.art{width:70px}.with-image .content{padding:15px}.content{padding:18px}}.stripe{background:linear-gradient(180deg,var(--accent),var(--cyan))}.content{padding:22px 26px;min-width:0}.top{display:flex;align-items:center;gap:10px;color:var(--accent);font-size:11px;font-weight:900;letter-spacing:.2em}.symbol{width:30px;height:30px;border-radius:9px;background:color-mix(in srgb,var(--accent) 17%,transparent);display:grid;place-items:center;font-size:17px}.headline{font-size:clamp(18px,3vw,25px);font-weight:900;letter-spacing:.04em;margin:14px 0 4px;overflow-wrap:anywhere}.who{font-size:clamp(14px,2.3vw,19px);color:#d6d1e9;overflow-wrap:anywhere}.amount{font-size:clamp(30px,5vw,46px);font-weight:950;letter-spacing:-.04em;margin-top:8px;background:linear-gradient(100deg,#fff,var(--accent),var(--cyan));background-clip:text;-webkit-background-clip:text;color:transparent}.message{border-left:2px solid var(--accent);padding:7px 0 7px 12px;margin-top:12px;color:#d2cde5;overflow-wrap:anywhere;white-space:pre-wrap}.brand{display:flex;justify-content:space-between;gap:12px;margin-top:16px;color:#8f8ba7;font-size:9px;letter-spacing:.16em}.live{color:var(--cyan)}.empty{color:#a19dbd;font-size:12px;text-align:center}.hint{position:fixed;bottom:10px;left:0;right:0;text-align:center;color:#8f8ba7;font-size:10px;letter-spacing:.1em;opacity:.7}@keyframes enter{0%{opacity:0;transform:translateY(28px) scale(.96);filter:blur(4px)}70%{opacity:1;transform:translateY(-3px) scale(1.01);filter:blur(0)}100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}@keyframes leave{to{opacity:0;transform:translateY(-18px) scale(.98);filter:blur(3px)}}@keyframes slideIn{from{opacity:0;transform:translateX(-70px);filter:blur(3px)}to{opacity:1;transform:translateX(0);filter:blur(0)}}@keyframes popIn{0%{opacity:0;transform:scale(.55)}75%{opacity:1;transform:scale(1.06)}100%{opacity:1;transform:scale(1)}}@keyframes glitchIn{0%{opacity:0;transform:translateX(-15px);clip-path:inset(40% 0 50% 0)}20%{opacity:1;transform:translateX(8px);clip-path:inset(10% 0 65% 0)}40%{transform:translateX(-5px);clip-path:inset(60% 0 10% 0)}60%{transform:translateX(3px);clip-path:inset(0 0 0 0)}100%{opacity:1;transform:translateX(0);clip-path:inset(0 0 0 0)}}body.preview{background:radial-gradient(ellipse at 50% 50%,#29204a,transparent 60%),#090910}.preview .stage{align-items:center}.preview .hint{opacity:1}@media(prefers-reduced-motion:reduce){.alert.show{animation:none;opacity:1;transform:none;filter:none}}
</style></head><body><main class="stage"><article class="alert" id="alert"><div class="stripe"></div><img class="art" id="art" alt=""><div class="content"><div class="top"><span class="symbol">ϟ</span><span id="brandTitle">DONAT CORE / ALERT SYSTEM</span><span style="margin-left:auto" class="live">● LIVE DEMO</span></div><div class="headline" id="title">НОВЫЙ ДОНАТ</div><div class="who"><span id="name">PixelFox</span> поддержал канал</div><div class="amount" id="amount">250 ₽</div><div class="message" id="message">Залетаем на новый уровень!</div><div class="brand"><span>NEON CORE</span><span>POWERED BY DONAT CORE</span></div></div></article></main><div class="hint" id="hint">CORE ALERTS · DEMO OVERLAY</div>
<script>
const p=new URLSearchParams(location.search);const get=(k,d)=>p.has(k)?p.get(k):d;const color=get('color','purple');const colors={purple:['#a78bfa','rgba(167,139,250,.3)'],cyan:['#43ead7','rgba(67,234,215,.25)'],green:['#73e6a3','rgba(115,230,163,.24)']};const chosen=colors[color]||colors.purple;document.documentElement.style.setProperty('--accent',chosen[0]);document.documentElement.style.setProperty('--glow',chosen[1]);const duration=Math.max(2,Math.min(12,Number(get('duration','6'))||6));document.documentElement.style.setProperty('--duration',duration+'s');const animation=get('animation','rise');const alertEl=document.getElementById('alert');if(['slide','pop','glitch'].includes(animation))alertEl.classList.add('anim-'+animation);const imageUrl=get('image','');if(imageUrl){try{const parsed=new URL(imageUrl);if(['http:','https:'].includes(parsed.protocol)){const img=document.getElementById('art');img.src=parsed.href;img.onload=()=>alertEl.classList.add('with-image');img.onerror=()=>{img.removeAttribute('src')}}}catch(e){}}const title=get('title','НОВЫЙ ДОНАТ').slice(0,40);const name=get('name','PixelFox').slice(0,32);const message=get('message','Залетаем на новый уровень!').slice(0,100);const raw=Number(get('amount','250'));const amount=Number.isFinite(raw)&&raw>0?Math.min(Math.floor(raw),100000000):250;const money=n=>new Intl.NumberFormat('ru-RU').format(n)+' ₽';document.title='CORE ALERTS — '+title;document.getElementById('title').textContent=title;document.getElementById('name').textContent=name;document.getElementById('message').textContent=message;document.getElementById('amount').textContent=money(amount);function playSound(){const kind=get('sound','none');if(kind==='none')return;try{const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;const ctx=new Ctx();const seq=kind==='arcade'?[660,880,1100]:kind==='pulse'?[220,440,660]:[880,660];let t=ctx.currentTime;seq.forEach(f=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type=kind==='arcade'?'square':'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.1,t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+.18);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.2);t+=.16});setTimeout(()=>ctx.close(),1200)}catch(e){}}if(p.get('show')==='1'){document.body.classList.add('preview');document.getElementById('hint').textContent='ПРЕДПРОСМОТР ОПОВЕЩЕНИЯ · DEMO';requestAnimationFrame(()=>{alertEl.classList.add('show');playSound()})}else{document.getElementById('hint').textContent='CORE ALERTS · ГОТОВ К ПОДКЛЮЧЕНИЮ СЕРВЕРА';}
</script></body></html>
